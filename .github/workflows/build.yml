name: Build downloads

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            name: linux-x64
          - runner: windows-2022
            name: windows-x64
          - runner: macos-14
            name: macos-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .[build]
      - run: python packaging/build.py --output release-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: PumpWizard-${{ matrix.name }}
          path: release-artifacts/
          if-no-files-found: error
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release-artifacts/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" release-artifacts/*/* \
            --repo "${{ github.repository }}" \
            --title "PumpWizard Runner $TAG" \
            --generate-notes
